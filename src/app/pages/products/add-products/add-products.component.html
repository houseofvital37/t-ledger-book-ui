<div
  id="site-registration"
  class="flex flex-column items-center bg-[--lightblue-bg-color]"
>
  <div class="flex flex-column gap-2.5 max-w-[830PX] w-full">
    <div
      class="card flex flex-row py-2 justify-between items-center sticky overflow-y-auto top-0 z-50 bg-transparent border-none"
    >
      <div class="flex items-center gap-2 text-lg font-semibold">
        <button
          (click)="back()"
          class="p-2 border rounded flex bg-[#fff] hover:bg-[--primary-color] hover:text-white"
        >
          <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
        </button>
        {{ productId ? "Edit" : "Add" }} Product
      </div>
      <button
        *ngIf="!productId"
         [nzLoading]="isLoading"
         (click)="addProduct()"
        nz-button
        class="flex items-center bg-[--primary-color] text-white rounded h-[36px] py-2.5 px-3 gap-2.5"
      >
        <i nz-icon nzType="plus-circle"></i>
        Add Product
      </button>
      <button
        *ngIf="productId"
        nz-button
        [nzLoading]="isLoading"
        (click)="updateProduct()"
        class="flex items-center bg-[--primary-color] text-white rounded h-[36px] py-2.5 px-2.5"
      >
        <i nz-icon nzType="plus-circle"></i>
        Submit
      </button>
    </div>
    <div class="flex flex-column gap-4 max-w-[830px] overflow-y-auto h-[80vh]">
      <!-- Basic Detail -->
      <div class="card p-4 flex flex-column gap-3"  [formGroup]="basicDetail">
        <div class="font-semibold text-md">Product Detail</div>
        <div class="flex flex-wrap gap-4">
          <div class="inputWrap w-6/12 max-w-[48%]">
            <div class="text-muted text-xs p-1">Product Name</div>
            <nz-input-group class="border rounded p-0 px-2">
                <input required maxlength="100" formControlName="productName" class="input-field max-h-[36px]" placeholder="Enter Product Name">
            </nz-input-group>                
          </div>
          <div class="inputWrap w-6/12 max-w-[48%]">
            <div class="text-muted text-xs p-1">Product SKU</div>
            <nz-input-group class="border rounded p-0 px-2">
                <input required maxlength="100" formControlName="productSku" class="input-field max-h-[36px]" placeholder="Enter Product SKU">
            </nz-input-group>                
          </div>
          <div class="inputWrap w-6/12 max-w-[48%]">
            <div class="text-muted text-xs p-1">Sale Price</div>
            <nz-input-group class="border rounded p-0 px-2">
                <input required type="number" max="999999" min="0" formControlName="salePrice" class="input-field max-h-[36px]" placeholder="Enter Sale Price">
            </nz-input-group>                
          </div>
          <div class="inputWrap w-6/12 max-w-[48%]">
            <div class="text-muted text-xs p-1">Purchase Price</div>
            <nz-input-group class="border rounded p-0 px-2">
                <input required type="number" max="999999" min="0" formControlName="purchasePrice" class="input-field max-h-[36px]" placeholder="Enter Purchase Price">
            </nz-input-group>                
          </div>
          <div class="inputWrap w-6/12 max-w-[48%]">
            <div class="text-muted text-xs p-1">Product Category</div>
            <nz-input-group class="border rounded p-0">
              <nz-select
                nzPlaceHolder="Select Product Category"
                [nzDropdownClassName]="'option-width-100'"
                [nzShowSearch]="true"
                [nzAllowClear]="true"
                [nzDropdownClassName]="'option-width-100'" 
                class="max-h-[36px] w-100"
                formControlName="productCategoryId"
              >
                <nz-option
                  *ngFor="let category of productCategories"
                  [nzValue]="category.productCategoryId"
                  [nzLabel]="category.productCategory"
                ></nz-option>
              </nz-select>
              </nz-input-group>
          </div>
          <div class="inputWrap w-6/12 max-w-[48%]">
            <div class="text-muted text-xs p-1">Supplier</div>
            <nz-input-group class="border rounded p-0">
              <nz-select
                nzPlaceHolder="Select Supplier"
                [nzDropdownClassName]="'option-width-100'"
                [nzShowSearch]="true"
                [nzAllowClear]="true"
                [nzDropdownClassName]="'option-width-100'" 
                class="max-h-[36px] w-100"
                formControlName="supplierId"
              >
                <nz-option
                  *ngFor="let supplier of suppliersList"
                  [nzValue]="supplier.supplierId"
                  [nzLabel]="supplier.supplierName"
                ></nz-option>
              </nz-select>
              </nz-input-group>
          </div>
          <div class="inputWrap w-100 ">
            <div class="text-muted text-xs p-1">Product Details</div>
            <nz-input-group class="border rounded p-0 px-2 overflow-hidden">
                <textarea type="text" required [rows]="3" [maxlength]="500" formControlName="productDetail" class="py-2 input-field w-100 max-h-[70px]" placeholder="Enter Product Details"></textarea>
            </nz-input-group>                
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="false" class="w-full h-[100vh] top-0 left-0 text-center absolute z-[51] flex bg-[#f1f1f16b]">
      <span nz-icon nzType="loading" class="m-auto text-[--blue-color] text-3xl"></span>
  </div>
  </div>
</div>
