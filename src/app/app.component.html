                          </div>

                          </div>
                    </div> -->
                <!-- Select Company Drop-Down  -->

                    </div>
                </div> -->
                <!-- links -->
                <div class="flex items-center gap-4 text-md font-semibold">
                    
                    <!-- <span  class="cursor-pointer hover:text-[--primary-color]" (click)="routeToMenuPath(trackOrderMenu)" [ngClass]="{'text-[--primary-color]': router.url=='/order/order-details'}" >{{trackOrderMenu?.page}}</span> -->

                    <!-- <span class="cursor-pointer hover:text-[--primary-color]" [ngClass]="{'text-[--primary-color]': pageHeading == 'Shipping Partners'}" [routerLink]="['/shipping-partners']">Shipping Partners</span>

                <div class="d-flex gap-2 items-center">

                    <i class="text-xl cursor-pointer hover:text-[--primary-color] hover:rounded-full px-[8px] py-1 hover:bg-[--grey1-color]" nz-dropdown  (nzVisibleChange)="notificationMenuChange($event)"  [ngClass]="{'borderActive': dropDownBorder === true}" [nzDropdownMenu]="notification" nz-icon nzType="bell" nzTrigger="click" nzTheme="fill"></i>

                        <nz-avatar [nzSize]="35" class="d-flex items-center justify-center bg-[--primary-color]" nzIcon="user"></nz-avatar>

    <nz-layout class="app-layout bg-[--lightest-blue-color] overflow-y-hidden">
        <nz-sider class="menu-sidebar opacity-80 shadow-sm" nzCollapsible nzWidth="256px" nzBreakpoint="md" [(nzCollapsed)]="isCollapsed" [nzTrigger]="null"
                  (mouseover)="!sideLock ? isCollapsed = false : ''" (mouseleave)="!sideLock ? isCollapsed = true : ''">
            <div class="flex flex-column justify-between pt-2 h-screen overflow-y-hidden hover:overflow-auto">
                <div>
                    <ul class="bg-[--grey2-color]" nz-menu nzTheme="light" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
                        <li class="px-2 flex  "      [ngClass]="{'justify-content-end': !isCollapsed , 'justify-content-center' :  isCollapsed,'clicked-color': isClicked }">
                            <span class="cursor-pointer text-md muted  hover:text-[--primary-color]"  [ngStyle]="{'color': isClicked ? 'gray' : '#0062FF'}" (click)="isClicked = !isClicked" nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" (click)="sideLock = !sideLock;"> </span>
                        </li>
                        <!-- Side Bar Menu -->
                        <ng-container *ngFor="let menu of navigationRoutes">
                            <!-- Menu Without DropDown -->
                            <ng-container>
                                <li nz-menu-item (click)="routeToMenuPath(menu)"  class="gap-2 text-md font-semibold " [nzSelected]="menu.isSelected">
                                    <i nz-icon [nzType]="menu.icon" nzTheme="outline" class="pr-2"></i>
                                    <a [ngClass]="{'hidden' : isCollapsed}">{{menu.page}}</a>
                                </li>
                            </ng-container>
                            <!-- Menu With DropDown -->
                            <!-- <ng-container *ngIf="menu?.child?.length">

                                    class="gap-2.5 text-md font-semibold">
                                    <ul>
                                        <div *ngFor="let submenu of menu?.child; let i= index">
                                            <li  (click)="routeToSubmenuPath(submenu , menu?.path)"
                                                nz-menu-item class="gap-2.5 text-xs font-semibold text-[12px]" [ngClass]="{ 'reloadMenuBind' : menu.path == router.url,'sideBarDesign':(submenu.path == router.url && !isCollapsed) || (submenu.path == '/'+router.url.split('/' , 2)[1] && router.url != '/order/airway-bill' && router.url != '/order/pickup-sheet' && router.url != '/report/payment/invoice-summary' && router.url != '/order/order-details') , 'sideBarDesignCollapsed': (submenu.path == router.url && isCollapsed)  }">
                                                    <i nz-icon [nzType]="submenu.menuIcon" nzTheme="fill"></i>
                                                    <a [ngClass]="{'hidden' : isCollapsed , 'reloadMenuBind' : !isCollapsed && (router.url == submenu?.actionCode) }">{{submenu.moduleName}}</a>
                                            </li>
                                        </div>
                                    </ul>
                                </li>
                            </ng-container> -->
                        </ng-container>
                    </ul>
                </div>
            </div>
        </nz-sider>
        <nz-layout class="bg-[--lightest-blue-color]">
            <nz-content class="bg-[--lightest-blue-color]">
                <div *ngIf="isLoading"  class="d-flex w-100 align-center justify-content-center mt-40">
                    <ng-template #indicatorTemplate><span nz-icon nzType="loading" class="heading-24"></span></ng-template>
                    <nz-spin nzSimple [nzIndicator]="indicatorTemplate" [nzSize]="'large'"></nz-spin>
                </div>
                <div id="main" class="p-2 mb-[16px] sm:h-[45vh] md:h-[75vh] lg:h-[91vh] xl:h-[91vh] 2xl:h-[91vh] overflow-y-hidden overflow-x-hidden">
                    <router-outlet></router-outlet>
                </div>   
            </nz-content>
        </nz-layout>
    </nz-layout>
</div>

<router-outlet *ngIf="isLoginPage()"></router-outlet>


<nz-dropdown-menu #profile="nzDropdownMenu">
    <ul nz-menu class="min-w-[250px]">
        <li nz-menu-item class="border-bottom w-100">
            <div class="d-flex flex-column gap-2.5">
                <div class="text-md font-semibold flex gap-2.5">
                    <nz-avatar [nzSize]="35" class="d-flex items-center justify-center bg-[--primary-color]" nzIcon="user"></nz-avatar> 
                    <div class="flex flex-column">
                        {{loginUserFullName}}
                        <div class="text-xs muted">{{loginUserEmail}}</div>
            
                    </div>
                </div>
                <div class="text-xs muted">Account ID: <span class="font-semibold">{{pmsId}}</span> <i nz-icon nzType="copy" nzTheme="fill" class="!pl-3 !w-fit" nz-tooltip nzTooltipTitle="Copy Account ID" (click)="copyToClipboard()" ></i></div>
            </div>
        </li>
        <!-- <li routerLink="/settings/account" nz-menu-item class="w-100 gap-2.5 mt-3 font-semibold">
            <i nz-icon nzType="setting" nzTheme="fill"></i>
            Account Setting
        </li> -->
        <li  routerLink="/settings/account" nz-menu-item class="w-100 gap-2.5 mt-3 font-semibold">
            <i nz-icon nzType="setting" nzTheme="fill"></i>
            Account Setting
        </li>
        <li (click)="logout()" nz-menu-item class="w-100 gap-2.5 text-[--warn-color] font-semibold">
            <span nz-icon nzType="poweroff" nzTheme="outline"></span>
            Logout
        </li>
    </ul>
</nz-dropdown-menu>

<nz-dropdown-menu #notification="nzDropdownMenu">
    <ul nz-menu> 
        <li class="p-16-24 bb d-flex flex-column" style="min-width: 200px; width: 100%; max-width: 400px;" nz-menu-item>
            <div  class="flex flex-column gap-4 w-100">
                <div class="text-xs w-100 text-center px-5 my-3 muted">You have 0 notifications</div>    
            </div>      
        </li>

    </ul>
</nz-dropdown-menu>
