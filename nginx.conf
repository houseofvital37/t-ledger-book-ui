server {
    listen 80;

    root /usr/share/nginx/html/browser;
    index index.html index.htm;

    server_name _;

    location / {
        try_files $uri /index.html;
    }

    # Optional: prevent caching of index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.html;
}
